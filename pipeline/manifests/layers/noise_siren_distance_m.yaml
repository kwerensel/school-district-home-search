metric_key: noise_siren_distance_m
name: Distance to mapped emergency response facility
source: OpenStreetMap emergency response amenities via Overpass
source_urls:
  - https://www.openstreetmap.org/
  - https://wiki.openstreetmap.org/wiki/Overpass_API
vintage: "2026-08-26"
units: meters
direction: lower_better
native_resolution: mapped OSM amenity points and facility polygons
allowed_range: [0, 200000]
reduction_method: nearest_distance
coverage_threshold: 1.0
grains:
  - listing
listing_reductions:
  - distance_to_nearest
notes: >
  Straight-line distance from a listing point to the nearest mapped
  amenity=fire_station, police, or hospital feature. Zero can mean the point is
  inside a mapped facility polygon. This is a potential intermittent-noise
  proximity indicator, not a routed distance, measured sound level, call
  frequency, or emergency-response score. OpenStreetMap coverage varies.
