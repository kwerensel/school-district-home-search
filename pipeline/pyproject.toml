[project]
name = "groundtruth-pipeline"
version = "0.1.0"
description = "Deterministic geospatial ingestion pipeline for Groundtruth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "contextily",
  "geopandas",
  "matplotlib",
  "osmnx",
  "psycopg",
  "pydantic",
  "rasterio",
  "rasterstats",
  "shapely",
  "typer",
]

[project.scripts]
gt = "gt.cli:app"

[dependency-groups]
dev = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gt"]
